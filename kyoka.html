<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>許可証(書類保管)</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; font-family:"Hiragino Sans","Yu Gothic",sans-serif; }
  body { background:#f4f4f5; padding-bottom:60px; }
  header { background:#0d9488; color:#fff; padding:14px 16px; }
  header h1 { font-size:19px; }
  header .sub { font-size:12px; opacity:.85; margin-top:2px; }
  .wrap { padding:12px; max-width:760px; margin:0 auto; }
  .backBtn { width:100%; padding:12px; border:none; border-radius:12px; background:#555; color:#fff; font-size:15px; font-weight:bold; margin-bottom:10px; }
  .upCard { background:#fff; border-radius:14px; padding:14px; box-shadow:0 1px 4px rgba(0,0,0,.08); margin-bottom:14px; }
  .upCard h2 { font-size:16px; margin-bottom:6px; }
  label { display:block; font-size:13px; font-weight:bold; color:#52525b; margin:10px 0 4px; }
  input, select { width:100%; padding:11px; font-size:15px; border:1px solid #d4d4d8; border-radius:10px; background:#fff; }
  .upBtn { width:100%; padding:14px; border:none; border-radius:12px; background:#0d9488; color:#fff; font-size:16px; font-weight:bold; margin-top:12px; }
  .upBtn:disabled { opacity:.5; }
  .note { font-size:12px; color:#71717a; line-height:1.7; margin-top:8px; }
  .yearHead { font-size:16px; font-weight:bold; color:#0d9488; margin:16px 0 8px; border-bottom:2px solid #0d9488; padding-bottom:4px; }
  .card { background:#fff; border-radius:12px; padding:12px; margin-bottom:8px; box-shadow:0 1px 3px rgba(0,0,0,.08); display:flex; align-items:center; gap:10px; }
  .card .info { flex:1; min-width:0; }
  .card .ttl { font-size:15px; font-weight:bold; }
  .card .sub { font-size:12px; color:#71717a; margin-top:2px; }
  .openBtn { border:none; border-radius:10px; padding:12px 16px; font-size:14px; font-weight:bold; background:#0d9488; color:#fff; white-space:nowrap; }
  .delBtn { border:none; border-radius:10px; padding:12px; font-size:14px; background:#e2e8f0; color:#0d9488; }
  .empty { text-align:center; color:#a1a1aa; padding:36px 10px; font-size:14px; line-height:1.9; }
  #toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#333; color:#fff; padding:12px 22px; border-radius:999px; font-size:14px; opacity:0; pointer-events:none; transition:.25s; z-index:200; white-space:nowrap; }
  #toast.show { opacity:1; }
</style>
</head>
<body>

<header>
  <h1>📜 許可証の保管</h1>
  <div class="sub">SEKINE MASTER ・ 許可証(PDF)の保管。ISO管理の許可一覧にも自動で反映されます</div>
</header>

<div class="wrap">
<button class="backBtn" onclick="location.href='index.html'">← マスタ管理に戻る</button>

<div class="upCard">
  <h2>📤 許可証をアップする</h2>
  <label>どの許可証？(業務管理の許可証リストから選択)</label>
  <select id="docPermit" onchange="document.getElementById('docTypeFree').style.display = this.value==='__free__' ? 'block' : 'none'"></select>
  <input type="text" id="docTypeFree" placeholder="許可証の名前を入力" style="display:none;margin-top:6px;">
  <label>日付の種類</label>
  <div style="display:flex;gap:8px;">
    <label style="flex:1;display:flex;align-items:center;gap:6px;font-weight:bold;border:1px solid #d4d4d8;border-radius:10px;padding:10px;margin:0;"><input type="radio" name="dateKind" value="許可期限" checked style="width:auto;">許可期限</label>
    <label style="flex:1;display:flex;align-items:center;gap:6px;font-weight:bold;border:1px solid #d4d4d8;border-radius:10px;padding:10px;margin:0;"><input type="radio" name="dateKind" value="交付日" style="width:auto;">交付日</label>
  </div>
  <label>日付</label>
  <input type="date" id="docDate">
  <label>ファイル(PDFまたは写真)</label>
  <input type="file" id="docFile" accept="application/pdf,image/*" multiple>
  <button class="upBtn" id="upBtn" onclick="uploadDoc()">📤 アップして保管する</button>
  <div class="note">ファイルは複数まとめて選べます(一括アップ)。複数のときは名前がいったんファイル名で入るので、あとから各カードの✏️で名前と許可期限を直してください。更新のたびにアップすれば古い許可証も履歴として残ります。許可期限の管理は今まで通り業務管理で。</div>
</div>

<div id="docList"><div class="empty">読み込み中...</div></div>
</div>

<div id="editModalBg" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60;padding:16px;" onclick="if(event.target===this)closeEditDoc()">
  <div style="background:#fff;border-radius:14px;padding:16px;max-width:480px;margin:60px auto;">
    <h2 style="font-size:16px;margin-bottom:4px;">✏️ 名前と日付を編集</h2>
    <input type="hidden" id="editDocId">
    <label>名前(どの許可証か)</label>
    <input type="text" id="editDocType">
    <label>日付の種類</label>
    <div style="display:flex;gap:8px;">
      <label style="flex:1;display:flex;align-items:center;gap:6px;font-weight:bold;border:1px solid #d4d4d8;border-radius:10px;padding:10px;margin:0;"><input type="radio" name="editDateKind" value="許可期限" style="width:auto;">許可期限</label>
      <label style="flex:1;display:flex;align-items:center;gap:6px;font-weight:bold;border:1px solid #d4d4d8;border-radius:10px;padding:10px;margin:0;"><input type="radio" name="editDateKind" value="交付日" style="width:auto;">交付日</label>
    </div>
    <label>日付</label>
    <input type="date" id="editDocDate">
    <div style="display:flex;gap:8px;margin-top:14px;">
      <button style="flex:1;padding:12px;border:none;border-radius:10px;background:#e4e4e7;color:#3f3f46;font-size:15px;font-weight:bold;" onclick="closeEditDoc()">キャンセル</button>
      <button style="flex:1;padding:12px;border:none;border-radius:10px;background:#0d9488;color:#fff;font-size:15px;font-weight:bold;" onclick="saveEditDoc()">保存</button>
    </div>
  </div>
</div>
<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ===== Firebase読み取り節約(通信の自動休止・再開) 2026-10 =====
   ・画面が見えていない(別タブ・最小化・スマホのスリープ)状態が5分続いたら、リアルタイム監視を止めます
     → 画面に戻ると自動で再開します
   ・夜間(19時〜翌6時)は、30分さわらなければ休止します(モニター出しっぱなし対策)
     → 画面をタップすると再開、朝6時には自動で再開します
   ※このブロックは全アプリ共通です。時間を変えるときは下の数字だけ変えてください */
(function(){
  if(!window.firebase || !firebase.firestore) return;
  var NIGHT_FROM = 19;              // 夜間休止の開始(時)
  var NIGHT_TO   = 6;               // 夜間休止の終了(時)
  var HIDDEN_WAIT = 5*60*1000;      // 見えなくなってから休止するまで(5分)
  var NIGHT_IDLE  = 30*60*1000;     // 夜間、さわらずに休止するまで(30分)

  var subs = [], paused = false, reason = '', hiddenTimer = null, lastInput = Date.now(), overlay = null;
  function isNight(){ var h = new Date().getHours(); return h >= NIGHT_FROM || h < NIGHT_TO; }
  function isVisible(){ return document.visibilityState !== 'hidden'; }

  // onSnapshot(リアルタイム監視)を、止めたり再開したりできる形に包む
  function wrap(proto){
    if(!proto) return;
    var orig = proto.onSnapshot;
    if(!orig || orig.__fsSaver) return;
    var w = function(){
      var s = { ref:this, args:Array.prototype.slice.call(arguments), unsub:null, dead:false };
      s.start = function(){ if(!s.dead && !s.unsub) s.unsub = orig.apply(s.ref, s.args); };
      s.stop  = function(){ if(s.unsub){ try{ s.unsub(); }catch(e){} s.unsub = null; } };
      subs.push(s);
      if(!paused) s.start();
      return function(){ s.dead = true; s.stop(); var i = subs.indexOf(s); if(i >= 0) subs.splice(i, 1); };
    };
    w.__fsSaver = true;
    proto.onSnapshot = w;
  }
  wrap(firebase.firestore.Query && firebase.firestore.Query.prototype);
  wrap(firebase.firestore.CollectionReference && firebase.firestore.CollectionReference.prototype);
  wrap(firebase.firestore.DocumentReference && firebase.firestore.DocumentReference.prototype);

  function showOverlay(){
    if(!document.body) return;
    if(!overlay){
      overlay = document.createElement('div');
      overlay.id = 'fsSaverOverlay';
      overlay.setAttribute('style', 'position:fixed;inset:0;z-index:2147483000;background:rgba(15,23,42,.72);display:flex;align-items:center;justify-content:center;padding:16px;cursor:pointer;');
      overlay.innerHTML = '<div style="background:#fff;color:#1f2937;border-radius:16px;padding:24px 22px;max-width:420px;width:100%;text-align:center;font-family:sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.3);">'
        + '<div style="font-size:42px;line-height:1;">💤</div>'
        + '<div style="font-size:20px;font-weight:bold;margin:10px 0 8px;">通信を休止しています</div>'
        + '<div style="font-size:14px;line-height:1.7;color:#4b5563;">夜間(' + NIGHT_FROM + '時〜翌' + NIGHT_TO + '時)は、Firebaseの無料枠を節約するため自動で休止します。<br>朝' + NIGHT_TO + '時に自動で再開します。</div>'
        + '<div style="margin-top:16px;background:#16a34a;color:#fff;border-radius:999px;padding:12px;font-size:16px;font-weight:bold;">👆 タップして再開</div>'
        + '</div>';
      document.body.appendChild(overlay);
    }
    overlay.style.display = 'flex';
  }
  function hideOverlay(){ if(overlay) overlay.style.display = 'none'; }

  function pause(why){
    if(paused) return;
    paused = true; reason = why;
    subs.forEach(function(s){ s.stop(); });
    if(why === 'night') showOverlay();
  }
  function resume(byTap){
    lastInput = Date.now();
    if(!paused) return;
    paused = false; reason = '';
    // タップで再開したときは、そのタップが下のボタンに届かないよう少し待ってから幕を外す
    if(byTap) setTimeout(hideOverlay, 500); else hideOverlay();
    subs.forEach(function(s){ s.start(); });
  }

  // 画面の表示・非表示
  document.addEventListener('visibilitychange', function(){
    if(isVisible()){
      if(hiddenTimer){ clearTimeout(hiddenTimer); hiddenTimer = null; }
      resume(false);
    }else if(!hiddenTimer){
      hiddenTimer = setTimeout(function(){ hiddenTimer = null; if(!isVisible()) pause('hidden'); }, HIDDEN_WAIT);
    }
  });

  // さわったら「使っている」とみなす(休止中なら再開)
  ['pointerdown','touchstart','keydown','wheel'].forEach(function(ev){
    window.addEventListener(ev, function(e){
      if(paused && reason === 'night'){ resume(true); return; }
      lastInput = Date.now();
    }, { capture:true, passive:true });
  });

  // 1分ごとに夜間・朝の判定
  setInterval(function(){
    if(!isVisible()) return;
    if(!paused && isNight() && Date.now() - lastInput > NIGHT_IDLE) pause('night');
    else if(paused && reason === 'night' && !isNight()) resume(false);
  }, 60*1000);

  // 確認用(ブラウザのコンソールで fsSaver.status() と打つと状態が見られます)
  window.fsSaver = {
    status: function(){ return { paused:paused, reason:reason, listeners:subs.length }; },
    pause: function(){ pause('night'); },
    resume: function(){ resume(false); }
  };
})();
</script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyD99Mx0MnGpLSQjV7830bS7-gdCBSM9DGY",
  authDomain: "sekine-store.firebaseapp.com",
  projectId: "sekine-store",
  storageBucket: "sekine-store.firebasestorage.app",
  messagingSenderId: "781856496751",
  appId: "1:781856496751:web:e2e1e5de4cd803415a819a"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const DOC_COL = "isoKyokaDocs";     // 許可証の情報
const CHUNK_COL = "isoKyokaChunks"; // 中身(分割base64)
const PERMIT_COL = "kyokaShoumei";  // 業務管理の許可証リスト(読み取りのみ)
let permits = [];
db.collection(PERMIT_COL).onSnapshot(snap=>{
  permits = snap.docs.map(d=>({id:d.id, ...d.data()}));
  permits.sort((a,b)=>((a.order??999)-(b.order??999)) || String(a.area||"").localeCompare(String(b.area||""),"ja"));
  const sel = document.getElementById("docPermit");
  const cur = sel.value;
  sel.innerHTML = permits.map(p=>{
    const label = [p.area, p.wasteType, p.permitNumber?`(${p.permitNumber})`:""].filter(Boolean).join(" ");
    return `<option value="${esc(label)}">${esc(label)}</option>`;
  }).join("") + '<option value="__free__">その他(名前を入力)</option>';
  if(cur) sel.value = cur;
}, err=>console.error(err));
const CHUNK_SIZE = 700 * 1024;        // Firestoreの1MB制限より小さく分割
const MAX_MB = 15;

let docs = [];
let toastTimer;
function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),2800); }
function esc(t){ return String(t??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function fmtSize(b){ if(!b) return ""; if(b<1024*1024) return Math.round(b/1024)+"KB"; return (b/1024/1024).toFixed(1)+"MB"; }
function todayStr(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }


db.collection(DOC_COL).onSnapshot(snap=>{
  docs = snap.docs.map(d=>({id:d.id, ...d.data()}));
  docs.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  renderDocs();
}, err=>{ console.error(err); toast("⚠️ 読み込みエラー: "+err.message); });

function renderDocs(){
  const box = document.getElementById("docList");
  if(!docs.length){ box.innerHTML = '<div class="empty">まだ許可証がありません。<br>スキャンしたPDFや写真を上からアップしてください</div>'; return; }
  const byLabel = {};
  docs.forEach(d=>{
    const k = d.type || "その他";
    (byLabel[k] = byLabel[k] || []).push(d);
  });
  const labels = Object.keys(byLabel).sort((a,b)=>a.localeCompare(b,"ja"));
  box.innerHTML = labels.map(y=>`
    <div class="yearHead">📜 ${esc(y)}</div>
    ${byLabel[y].map(d=>`
      <div class="card">
        <div class="info">
          <div class="ttl">📄 ${esc(d.dateKind||"許可期限")} ${esc(d.date||"")}</div>
          <div class="sub">${esc(d.fileName||"")} ・ ${fmtSize(d.size)}</div>
        </div>
        <button class="openBtn" onclick="openDoc('${d.id}')">開く</button>
        <button class="delBtn" style="background:#e0f2fe;color:#0369a1;" onclick="editDoc('${d.id}')">✏️</button>
        <button class="delBtn" onclick="delDoc('${d.id}')">🗑</button>
      </div>`).join("")}
  `).join("");
}

function blobToBase64(blob){
  return new Promise((resolve, reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(String(r.result).split(",")[1]);
    r.onerror = ()=>reject(new Error("ファイルを読み込めませんでした"));
    r.readAsDataURL(blob);
  });
}

async function uploadOne(file, type, date, dateKind, btn, prefix){
  const b64 = await blobToBase64(file);
  const chunks = [];
  for(let i=0; i<b64.length; i+=CHUNK_SIZE) chunks.push(b64.slice(i, i+CHUNK_SIZE));
  const docRef = db.collection(DOC_COL).doc();
  for(let i=0; i<chunks.length; i++){
    await db.collection(CHUNK_COL).doc(docRef.id + "_" + i).set({ fileId: docRef.id, idx: i, data: chunks[i] });
    btn.textContent = `${prefix} ${i+1}/${chunks.length}`;
  }
  await docRef.set({
    type, date, dateKind,
    fileName: file.name,
    fileType: file.type || "application/pdf",
    size: file.size,
    chunkCount: chunks.length,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });
}
async function uploadDoc(){
  const files = Array.from(document.getElementById("docFile").files||[]);
  const date = document.getElementById("docDate").value;
  if(!files.length){ toast("ファイルを選んでください"); return; }
  if(!date){ toast("日付を入れてください"); return; }
  const dateKind = document.querySelector('input[name=dateKind]:checked').value;
  const over = files.find(f=>f.size > MAX_MB*1024*1024);
  if(over){ toast(`⚠️ ${over.name} が${MAX_MB}MBを超えています`); return; }
  let type = document.getElementById("docPermit").value;
  if(type==="__free__") type = document.getElementById("docTypeFree").value.trim();
  if(files.length===1 && !type){ toast("許可証を選ぶか名前を入力してください"); return; }
  const btn = document.getElementById("upBtn");
  btn.disabled = true;
  let ok = 0;
  try{
    for(let f=0; f<files.length; f++){
      const file = files[f];
      const t = files.length===1 ? type : file.name.replace(/\.[^.]+$/, "");
      await uploadOne(file, t, date, dateKind, btn, files.length>1 ? `アップ中 ${f+1}/${files.length}件目…` : "アップ中…");
      ok++;
    }
    document.getElementById("docFile").value = "";
    toast(files.length>1 ? `✅ ${ok}件を保管しました(名前は✏️で直せます)` : "✅ 保管しました");
  }catch(e){ console.error(e); toast(`❌ 失敗(${ok}件は保管済み): `+e.message); }
  btn.disabled = false; btn.textContent = "📤 アップして保管する";
}

window.openDoc = async function(id){
  const d = docs.find(x=>x.id===id);
  if(!d) return;
  const w = window.open("", "_blank"); // 先に開く(スマホのポップアップ制限対策)
  try{
    const snap = await db.collection(CHUNK_COL).where("fileId","==",id).get();
    const parts = snap.docs.map(x=>x.data()).sort((a,b)=>a.idx-b.idx);
    if(!parts.length) throw new Error("中身が見つかりません");
    const b64 = parts.map(p=>p.data).join("");
    const bin = atob(b64);
    const arr = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([arr], {type: d.fileType||"application/pdf"}));
    if(w) w.location.href = url; else window.open(url,"_blank");
  }catch(e){ if(w) w.close(); toast("❌ 開けませんでした: "+e.message); }
};

window.editDoc = function(id){
  const d = docs.find(x=>x.id===id);
  if(!d) return;
  document.getElementById("editDocId").value = id;
  document.getElementById("editDocType").value = d.type||"";
  document.getElementById("editDocDate").value = d.date||"";
  document.querySelector('input[name=editDateKind][value="'+(d.dateKind||"許可期限")+'"]').checked = true;
  document.getElementById("editModalBg").style.display = "block";
};
window.closeEditDoc = function(){ document.getElementById("editModalBg").style.display = "none"; };
window.saveEditDoc = async function(){
  const id = document.getElementById("editDocId").value;
  const type = document.getElementById("editDocType").value.trim();
  const date = document.getElementById("editDocDate").value;
  if(!type){ toast("名前を入力してください"); return; }
  if(!date){ toast("日付を入れてください"); return; }
  const dateKind = document.querySelector('input[name=editDateKind]:checked').value;
  try{
    await db.collection(DOC_COL).doc(id).update({ type, date, dateKind });
    closeEditDoc(); toast("✅ 変更しました");
  }catch(e){ toast("❌ 変更に失敗: "+e.message); }
};
window.delDoc = async function(id){
  const d = docs.find(x=>x.id===id);
  if(!d) return;
  if(!confirm(`「${d.type} ${d.date}」を削除しますか？`)) return;
  try{
    const snap = await db.collection(CHUNK_COL).where("fileId","==",id).get();
    const batch = db.batch();
    snap.docs.forEach(x=>batch.delete(x.ref));
    batch.delete(db.collection(DOC_COL).doc(id));
    await batch.commit();
    toast("🗑 削除しました");
  }catch(e){ toast("❌ 削除に失敗: "+e.message); }
};
</script>
</body>
</html>
