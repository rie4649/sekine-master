<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1e293b">
<title>マスタ管理</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; background:#f1f5f9; color:#1e293b; padding-bottom:80px; }
  header { background:linear-gradient(135deg,#1e293b,#334155); color:#fff; padding:16px; position:sticky; top:0; z-index:50; }
  header h1 { font-size:20px; display:flex; align-items:center; gap:8px; }
  header .sub { font-size:11px; opacity:.7; margin-top:2px; letter-spacing:1px; }
  .summary { display:flex; gap:10px; padding:12px 16px; }
  .sum-card { flex:1; background:#fff; border-radius:14px; padding:12px; text-align:center; box-shadow:0 1px 4px rgba(0,0,0,.06); }
  .sum-card .num { font-size:26px; font-weight:700; }
  .sum-card .label { font-size:11px; color:#64748b; margin-top:2px; }
  .sum-card.warn .num { color:#dc2626; }
  .section { background:#fff; margin:10px 12px; border-radius:16px; padding:16px; box-shadow:0 1px 4px rgba(0,0,0,.06); }
  .section h2 { font-size:15px; margin-bottom:12px; display:flex; align-items:center; gap:6px; }
  .row { display:flex; gap:8px; margin-bottom:8px; }
  input[type=text], input[type=date], textarea, select {
    width:100%; padding:11px 12px; border:1.5px solid #cbd5e1; border-radius:10px; font-size:16px; background:#fff;
  }
  input:focus, textarea:focus { outline:none; border-color:#0d9488; }
  textarea { min-height:110px; font-size:14px; }
  .btn { display:block; width:100%; padding:13px; border:none; border-radius:12px; font-size:15px; font-weight:700; cursor:pointer; }
  .btn-main { background:#0d9488; color:#fff; }
  .btn-sub { background:#e2e8f0; color:#334155; }
  .btn-danger { background:#fee2e2; color:#dc2626; }
  .btn:active { opacity:.8; }
  .hint { font-size:12px; color:#64748b; margin-top:6px; line-height:1.5; }
  .toggle-head { display:flex; justify-content:space-between; align-items:center; cursor:pointer; }
  .toggle-head .arrow { transition:.2s; }
  .toggle-head.open .arrow { transform:rotate(180deg); }
  .toggle-body { display:none; margin-top:12px; }
  .toggle-body.show { display:block; }
  .search-bar { margin:0 12px; }
  .search-bar input { border-radius:12px; box-shadow:0 1px 4px rgba(0,0,0,.06); border:none; }
  .sort-row { display:flex; gap:8px; margin:10px 12px 0; }
  .sort-btn { flex:1; padding:9px; border:none; border-radius:10px; background:#e2e8f0; color:#475569; font-size:13px; font-weight:600; }
  .sort-btn.active { background:#1e293b; color:#fff; }
  .v-card { background:#fff; margin:8px 12px; border-radius:14px; padding:12px 14px; box-shadow:0 1px 4px rgba(0,0,0,.06); display:flex; align-items:center; gap:12px; }
  .v-info { flex:1; min-width:0; }
  .v-number { font-size:17px; font-weight:700; }
  .v-model { font-size:13px; color:#64748b; margin-top:1px; }
  .v-shaken { text-align:right; }
  .badge { display:inline-block; padding:4px 10px; border-radius:999px; font-size:12px; font-weight:700; }
  .badge.ok { background:#f1f5f9; color:#475569; }
  .badge.soon { background:#fef3c7; color:#b45309; }
  .badge.urgent { background:#fee2e2; color:#dc2626; }
  .badge.expired { background:#dc2626; color:#fff; }
  .v-days { font-size:11px; color:#94a3b8; margin-top:3px; }
  .v-edit { border:none; background:#f1f5f9; border-radius:10px; padding:10px 12px; font-size:14px; }
  .empty { text-align:center; color:#94a3b8; padding:40px 20px; font-size:14px; }
  /* モーダル */
  .modal-bg { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:100; align-items:flex-end; }
  .modal-bg.show { display:flex; }
  .modal { background:#fff; width:100%; border-radius:20px 20px 0 0; padding:20px 16px 30px; max-height:85vh; overflow-y:auto; }
  .modal h3 { font-size:16px; margin-bottom:14px; }
  .modal .field { margin-bottom:12px; }
  .modal .field label { font-size:12px; color:#64748b; display:block; margin-bottom:4px; font-weight:600; }
  .modal-btns { display:flex; gap:8px; margin-top:16px; }
  /* トースト */
  #toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); background:#1e293b; color:#fff; padding:12px 22px; border-radius:999px; font-size:14px; opacity:0; pointer-events:none; transition:.25s; z-index:200; white-space:nowrap; }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header>
  <h1>🗂 マスタ管理</h1>
  <div class="sub">SEKINE MASTER — 車両マスタ</div>
</header>

<div class="summary">
  <div class="sum-card"><div class="num" id="sumTotal">0</div><div class="label">登録台数</div></div>
  <div class="sum-card warn"><div class="num" id="sumUrgent">0</div><div class="label">車検30日以内</div></div>
  <div class="sum-card"><div class="num" id="sumSoon">0</div><div class="label">車検60日以内</div></div>
</div>

<!-- 新規登録 -->
<div class="section">
  <h2>➕ 車両を登録</h2>
  <div class="row">
    <input type="text" id="addNumber" placeholder="車番(例:上田100あ1234)">
  </div>
  <div class="row">
    <input type="text" id="addModel" placeholder="車種(例:大型ダンプ)">
  </div>
  <div class="row">
    <input type="date" id="addShaken">
  </div>
  <button class="btn btn-main" onclick="addVehicle()">登録</button>
  <div class="hint">車検満了日は空欄でも登録できます(あとから編集可)</div>
</div>

<!-- 一括登録 -->
<div class="section">
  <div class="toggle-head" id="bulkHead" onclick="toggleBulk()">
    <h2 style="margin:0">📋 一括登録(まとめて追加)</h2>
    <span class="arrow">▼</span>
  </div>
  <div class="toggle-body" id="bulkBody">
    <textarea id="bulkText" placeholder="1行に1台ずつ入力してください&#10;車番,車種,車検満了日&#10;&#10;例:&#10;上田100あ1234,大型ダンプ,2026/12/15&#10;上田100か5678,アームロール,2027/3/1&#10;上田800さ9012,軽トラック"></textarea>
    <div class="hint" style="margin-bottom:10px">「車番,車種,車検満了日」の順でカンマ区切り。車検満了日は省略OK(2026/12/15・2026-12-15どちらの形式でも読み取ります)</div>
    <button class="btn btn-main" onclick="bulkAdd()">一括登録する</button>
  </div>
</div>

<!-- 検索・並び替え -->
<div class="search-bar">
  <input type="text" id="searchBox" placeholder="🔍 車番・車種で検索" oninput="render()">
</div>
<div class="sort-row">
  <button class="sort-btn active" id="sortShaken" onclick="setSort('shaken')">車検が近い順</button>
  <button class="sort-btn" id="sortNumber" onclick="setSort('number')">車番順</button>
</div>

<!-- 車両一覧 -->
<div id="vehicleList"></div>

<!-- 編集モーダル -->
<div class="modal-bg" id="editModalBg" onclick="if(event.target===this)closeEdit()">
  <div class="modal">
    <h3>✏️ 車両を編集</h3>
    <div class="field"><label>車番</label><input type="text" id="editNumber"></div>
    <div class="field"><label>車種</label><input type="text" id="editModel"></div>
    <div class="field"><label>車検満了日</label><input type="date" id="editShaken"></div>
    <div class="modal-btns">
      <button class="btn btn-sub" onclick="closeEdit()">キャンセル</button>
      <button class="btn btn-main" onclick="saveEdit()">保存</button>
    </div>
    <button class="btn btn-danger" style="margin-top:10px" onclick="deleteVehicle()">🗑 この車両を削除</button>
  </div>
</div>

<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey: "AIzaSyD99Mx0MnGpLSQjV7830bS7-gdCBSM9DGY",
  authDomain: "sekine-store.firebaseapp.com",
  projectId: "sekine-store",
  appId: "1:781856496751:web:e2e1e5de4cd803415a819a"
});
const db = firebase.firestore();
const COL = "master_vehicles";

let vehicles = [];
let sortMode = "shaken";
let editingId = null;

/* ---------- データ購読 ---------- */
db.collection(COL).onSnapshot(
  snap => {
    vehicles = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  },
  err => {
    console.error(err);
    toast("⚠️ データ読み込みエラー(通信・ルールを確認)");
  }
);

/* ---------- 表示 ---------- */
function daysUntil(dateStr) {
  if (!dateStr) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const d = new Date(dateStr + "T00:00:00");
  return Math.round((d - today) / 86400000);
}
function shakenBadge(dateStr) {
  const days = daysUntil(dateStr);
  if (days === null) return `<span class="badge ok">未登録</span>`;
  const label = dateStr.replace(/-/g, "/");
  if (days < 0)   return `<span class="badge expired">期限切れ ${label}</span>`;
  if (days <= 30) return `<span class="badge urgent">${label}</span>`;
  if (days <= 60) return `<span class="badge soon">${label}</span>`;
  return `<span class="badge ok">${label}</span>`;
}
function render() {
  const q = (document.getElementById("searchBox").value || "").trim();
  let list = vehicles.slice();
  if (q) list = list.filter(v => (v.number||"").includes(q) || (v.model||"").includes(q));

  if (sortMode === "shaken") {
    list.sort((a,b) => (a.shakenDate || "9999-99-99").localeCompare(b.shakenDate || "9999-99-99"));
  } else {
    list.sort((a,b) => (a.number||"").localeCompare(b.number||"", "ja"));
  }

  const wrap = document.getElementById("vehicleList");
  if (!list.length) {
    wrap.innerHTML = `<div class="empty">車両がまだ登録されていません。<br>上のフォームか一括登録で追加してください。</div>`;
  } else {
    wrap.innerHTML = list.map(v => {
      const days = daysUntil(v.shakenDate);
      const daysText = days === null ? "" :
        days < 0 ? `${-days}日超過` : `あと${days}日`;
      return `
      <div class="v-card">
        <div class="v-info">
          <div class="v-number">${esc(v.number)}</div>
          <div class="v-model">${esc(v.model || "")}</div>
        </div>
        <div class="v-shaken">
          ${shakenBadge(v.shakenDate)}
          <div class="v-days">${daysText}</div>
        </div>
        <button class="v-edit" onclick="openEdit('${v.id}')">✏️</button>
      </div>`;
    }).join("");
  }

  document.getElementById("sumTotal").textContent = vehicles.length;
  document.getElementById("sumUrgent").textContent =
    vehicles.filter(v => { const d = daysUntil(v.shakenDate); return d !== null && d <= 30; }).length;
  document.getElementById("sumSoon").textContent =
    vehicles.filter(v => { const d = daysUntil(v.shakenDate); return d !== null && d > 30 && d <= 60; }).length;
}
function esc(s){ return (s||"").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

/* ---------- 登録 ---------- */
async function addVehicle() {
  const number = document.getElementById("addNumber").value.trim();
  const model  = document.getElementById("addModel").value.trim();
  const shaken = document.getElementById("addShaken").value;
  if (!number) { toast("車番を入力してください"); return; }
  if (vehicles.some(v => v.number === number)) { toast("⚠️ 同じ車番がすでに登録されています"); return; }
  try {
    await db.collection(COL).add({
      number, model, shakenDate: shaken || "",
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    document.getElementById("addNumber").value = "";
    document.getElementById("addModel").value = "";
    document.getElementById("addShaken").value = "";
    toast("✅ 登録しました");
  } catch(e) { console.error(e); toast("⚠️ 保存に失敗しました"); }
}

/* ---------- 一括登録 ---------- */
function toggleBulk() {
  document.getElementById("bulkHead").classList.toggle("open");
  document.getElementById("bulkBody").classList.toggle("show");
}
function normDate(s) {
  if (!s) return "";
  const m = s.trim().replace(/／/g,"/").match(/^(\d{4})[\/\-年](\d{1,2})[\/\-月](\d{1,2})日?$/);
  if (!m) return "";
  return `${m[1]}-${String(m[2]).padStart(2,"0")}-${String(m[3]).padStart(2,"0")}`;
}
async function bulkAdd() {
  const lines = document.getElementById("bulkText").value.split("\n").map(l => l.trim()).filter(Boolean);
  if (!lines.length) { toast("入力がありません"); return; }
  let ok = 0, skip = 0;
  const batch = db.batch();
  const existing = new Set(vehicles.map(v => v.number));
  for (const line of lines) {
    const parts = line.split(/[,、，]/).map(p => p.trim());
    const number = parts[0];
    if (!number || existing.has(number)) { skip++; continue; }
    existing.add(number);
    const ref = db.collection(COL).doc();
    batch.set(ref, {
      number,
      model: parts[1] || "",
      shakenDate: normDate(parts[2] || ""),
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    ok++;
  }
  if (!ok) { toast("登録できる行がありません(重複?)"); return; }
  try {
    await batch.commit();
    document.getElementById("bulkText").value = "";
    toast(`✅ ${ok}台を登録しました${skip ? `(${skip}行スキップ)` : ""}`);
  } catch(e) { console.error(e); toast("⚠️ 一括登録に失敗しました"); }
}

/* ---------- 編集・削除 ---------- */
function openEdit(id) {
  const v = vehicles.find(x => x.id === id);
  if (!v) return;
  editingId = id;
  document.getElementById("editNumber").value = v.number || "";
  document.getElementById("editModel").value = v.model || "";
  document.getElementById("editShaken").value = v.shakenDate || "";
  document.getElementById("editModalBg").classList.add("show");
}
function closeEdit() {
  editingId = null;
  document.getElementById("editModalBg").classList.remove("show");
}
async function saveEdit() {
  if (!editingId) return;
  const number = document.getElementById("editNumber").value.trim();
  if (!number) { toast("車番を入力してください"); return; }
  if (vehicles.some(v => v.number === number && v.id !== editingId)) { toast("⚠️ 同じ車番が他にあります"); return; }
  try {
    await db.collection(COL).doc(editingId).update({
      number,
      model: document.getElementById("editModel").value.trim(),
      shakenDate: document.getElementById("editShaken").value || "",
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    closeEdit();
    toast("✅ 保存しました");
  } catch(e) { console.error(e); toast("⚠️ 保存に失敗しました"); }
}
async function deleteVehicle() {
  if (!editingId) return;
  const v = vehicles.find(x => x.id === editingId);
  if (!confirm(`「${v ? v.number : ""}」を削除しますか?\nこの操作は元に戻せません。`)) return;
  try {
    await db.collection(COL).doc(editingId).delete();
    closeEdit();
    toast("🗑 削除しました");
  } catch(e) { console.error(e); toast("⚠️ 削除に失敗しました"); }
}

/* ---------- トースト ---------- */
let toastTimer;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2500);
}
</script>
</body>
</html>
